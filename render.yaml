# UNUSED on Hetzner. The live Render Free shop stays at https://github.com/panagiod/eshop
# Do not connect this repo to Render — that would not keep the current setup.
# Render Blueprint — $0/month web service (free instance).
# Live hostname: https://print-me-maybe.onrender.com
# One-click: https://render.com/deploy?repo=https://github.com/panagiod/eshop
services:
  - type: web
    name: print-me-maybe
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SHOP_NAME
        value: Print Me Maybe
      - key: SHOP_URL
        value: https://print-me-maybe.onrender.com
      - key: NOTIFY_EMAIL
        value: dimitrioupanagiotis@outlook.com
      # Free Resend API key — add in Render → Environment (never commit it).
      - key: RESEND_API_KEY
        sync: false
      # After you buy a domain and resend.com/domains says Verified.
      # Do not use print-me-maybe.onrender.com, outlook.com, or onboarding@resend.dev.
      # Example: Print Me Maybe <orders@printmemaybe.com>
      - key: RESEND_FROM
        sync: false
      # Free instances have no persistent disk — SQLite lives in /tmp (resets on redeploy).
      - key: DATA_DIR
        value: /tmp/eshop-data
