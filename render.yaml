# Render Blueprint — Starter web service + 1 GB disk so SQLite survives redeploys.
# About $7.25/month (Starter $7 + disk $0.25). Free cannot attach a disk.
# Live hostname: https://print-me-maybe.onrender.com
# One-click: https://render.com/deploy?repo=https://github.com/panagiod/eshop
services:
  - type: web
    name: print-me-maybe
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: eshop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SHOP_NAME
        value: Print Me Maybe
      - key: SHOP_URL
        value: https://print-me-maybe.onrender.com
      - key: NOTIFY_EMAIL
        value: dimitrioupanagiotis@outlook.com
      # Free Resend API key — add in Render → Environment (never commit it).
      - key: RESEND_API_KEY
        sync: false
      # After you buy a domain and resend.com/domains says Verified.
      # Do not use print-me-maybe.onrender.com, outlook.com, or onboarding@resend.dev.
      # Example: Print Me Maybe <orders@printmemaybe.com>
      - key: RESEND_FROM
        sync: false
      # SQLite + uploaded photos. Must match the disk mountPath.
      - key: DATA_DIR
        value: /var/data
